# SwarmForge packs and backends.
# Replaces swarm-forge's swarmforge.conf. Blank lines and # comments ignored.

# pack <name> <role> [<role> ...]   -- the chain, in order
pack 2 coder cleaner
pack 4 specifier coder cleaner architect
pack 6 specifier coder cleaner architect hardener QA

# backend <role> <cli>   -- which agent CLI runs that role.
# Known: claude | codex | opencode | agy | copilot
# Unlisted roles default to claude. Add a new CLI in the run_cli() case in ./swarm.
backend specifier claude
backend coder     claude
backend cleaner   claude
backend architect claude
backend hardener  claude
backend QA        claude

# model <role> <model>   -- optional. Omit a role to use that CLI's default.
# Written into the generated subagent file, and passed as a flag by `swarm run`.
# Use whatever string the backend expects, e.g. opus, gpt-5-codex,
# anthropic/claude-sonnet-5. Spend on the roles that reason; save on the rest.
#
# model <pack>.<role> <model>   -- optional, wins over the plain line above.
# `swarm run` and `swarm show` always honour this. Installed subagents honour it
# only for a role that has its own file per pack, which today means coder-2pack
# and cleaner-2pack. `coder` is one file shared by the 4- and 6-pack, so it can
# hold only one model; install prints a note when a pack-scoped line is ignored.
#   model 2.coder sonnet
#
# interactive <role>   -- optional. `swarm run` hands this role the terminal
# instead of running it headless, so it can talk to you. The specifier has to:
# it asks the user to settle ambiguity and to approve the spec before handoff.
# Only `claude` and `codex` have a verified interactive form that takes an
# initial prompt; any other backend runs headless with a warning, as does a run
# with no terminal. This matches by role name only, not by pack, so
# `interactive coder` would catch every pack's coder, not just the 2-pack one.
interactive specifier

model specifier opus
model coder     opus
model cleaner   sonnet
model architect opus
model hardener  sonnet
model QA        sonnet
